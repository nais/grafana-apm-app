# pnpm settings (pnpm >= 11 no longer reads the "pnpm" field in package.json;
# this file is the new home — https://pnpm.io/settings). The overrides below
# are mostly Dependabot/audit security pins and were being SILENTLY IGNORED
# while they lived in package.json.
overrides:
  protobufjs: '>=7.5.5'
  dompurify: '>=3.4.13'
  immutable: '>=5.1.5'
  serialize-javascript: '>=7.0.5'
  postcss: 8.5.25
  uuid: '>=14.0.0'
  http-proxy-agent: '>=7.0.0'
  js-cookie: '>=3.0.8'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  'react-router@>=6.7.0 <6.30.4': 6.30.4
  'react-router-dom@>=6.7.0 <6.30.4': 6.30.4
  'protobufjs@>=8.0.0 <=8.5.0': '>=8.6.0'
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  '@babel/core@<=7.29.0': '>=7.29.6'
  'protobufjs@>=8.0.0 <=8.4.0': '>=8.4.1'
  'protobufjs@>=8.2.0 <=8.4.2': '>=8.5.0'
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  'undici@>=7.23.0 <7.28.0': '>=7.28.0'
  'undici@>=7.0.0 <7.28.0': '>=7.28.0'
  'js-yaml@<3.15.0': '>=3.15.0'
  'js-yaml@>=4.0.0 <=4.1.1': '>=4.2.0'
  '@openfeature/react-sdk': 1.2.1
  '@openfeature/core': 1.9.2
  '@typescript-eslint/utils': 8.65.0
  'brace-expansion@^1.1.12': 1.1.18
  'js-yaml': 5.2.3
  # GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-5jgf-p345-68v8 — fast-uri host confusion / SSRF. Upper bound keeps
  # ajv, the only consumer, on the 3.x line it declares.
  fast-uri: '>=3.1.6 <4'
  # GHSA-px8p-9vwx-vf98 — @grafana/rrweb-packer pins the 0.4.x line, where
  # unzipSync loops forever on malformed ZIP64. 0.4.9 is the backport fix;
  # scoped and bounded so our own direct fflate (0.8.x) is untouched and
  # rrweb-packer is not dragged across two minors.
  'fflate@<0.4.9': '0.4.9'
  # GHSA-w9m9-85wc-3x92 — uncontrolled AST recursion.
  postcss-selector-parser: '>=7.1.3'
  # GHSA-2v37-7h3g-55p8 — custom generators loop forever on size 0. Upper
  # bound keeps postcss (which declares ^3.3.x) off the ESM-only 4+ majors.
  nanoid: '>=3.3.18 <4'
  # GHSA-xv26-6w52-cph6 — message corruption via protocol length headers
  # (faye-websocket -> webpack-livereload-plugin).
  websocket-driver: '>=0.7.5'
  # GHSA-3jxr-9vmj-r5cp — exponential-time brace expansion (minimatch 10.x).
  'brace-expansion@>=3.0.0 <5.0.7': '>=5.0.9'
