services:
  grafana:
    container_name: 'nais-apm-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.1.1}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - ${GRAFANA_PORT:-3000}:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/nais-apm-app
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/nais-apm-app

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.nais-apm-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: nais-apm-app
