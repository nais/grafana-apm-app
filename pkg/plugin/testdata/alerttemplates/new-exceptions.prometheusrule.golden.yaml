# Alerts when a frontend exception appears in "my-svc" that was not seen in the
# previous 7 days, and routes it to your team's existing alert receiver.
#
# REQUIRES FRONTEND (FARO) TELEMETRY. The recording rule this reads only counts
# exceptions carrying a session_id, which is a browser concept — a backend-only
# app gets a rule that never fires. Check that the series exists in your tenant
# before relying on this alert:
#
#   count(loki:apm:exception_sessions:count1m{service_namespace="team-a", service_name="my-svc"})
#
# The environment is implied by WHERE you apply this: the recording rule is
# per-cluster, so apply it in the cluster you want watched.
#
# Generated by the nais APM plugin — https://github.com/nais/grafana-apm-app
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: "nais-apm-new-exceptions-my-svc"
  namespace: "team-a"
  labels:
    team: "team-a"
    app: "my-svc"
spec:
  groups:
    - name: nais-apm-new-exceptions
      # 7d range vector — evaluate at the same 5m the Grafana variant ships.
      interval: 5m
      rules:
        - alert: NewException
          expr: |
            sum by (service_namespace, service_name, hash) (
              sum_over_time(loki:apm:exception_sessions:count1m{service_namespace="team-a", service_name="my-svc"}[30m])
            )
            unless on (service_namespace, service_name, hash)
            sum by (service_namespace, service_name, hash) (
              count_over_time(loki:apm:exception_sessions:count1m{service_namespace="team-a", service_name="my-svc"}[7d] offset 30m)
            )
          for: 5m
          labels:
            namespace: "team-a"
            severity: warning
          annotations:
            summary: "New frontend exception in my-svc not seen in the previous 7 days"
            message: "Exception {{ $labels.hash }} in my-svc was not seen in the previous 7 days"
            consequence: "Users are hitting an error this service has not produced before — most likely a regression from a recent deploy."
            action: "Open the issue in APM (dashboard_url), triage it, and resolve or ignore it so it stops alerting."
            dashboard_url: "https://grafana.example.test/a/nais-apm-app/services/team-a/my-svc?environment=prod-gcp&exceptionHash={{ $labels.hash }}&tab=issues"
