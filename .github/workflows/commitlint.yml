name: Commitlint

# Enforce Conventional Commits on every PR. release-please infers the next version
# and generates the CHANGELOG from these commit types, so this gate keeps that
# inference trustworthy.
on:
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          # Need the full range base..head to lint every commit in the PR.
          fetch-depth: 0
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          # Pinned >= 22.12.0: @commitlint/cli declares engines.node ">=22.12.0";
          # a bare '22' could resolve to an earlier 22.x patch and break install.
          node-version: '22.12.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint PR commit messages
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
