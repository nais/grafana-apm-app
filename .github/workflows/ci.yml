name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  # Required so the CI jobs (notably the required `ci-ok` aggregation check) run
  # on the merge queue's synthetic merge_group branch. Without this the queue
  # waits forever for a check that never fires.
  merge_group:

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          # Need the full range base..head to lint every commit in the PR.
          fetch-depth: 0
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          # Pinned >= 22.12.0: @commitlint/cli declares engines.node ">=22.12.0";
          # a bare '22' could resolve to an earlier 22.x patch and break install.
          node-version: '22.12.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint PR commit messages
        # Only runs on pull_request: the base/head SHAs below only exist for that
        # event. On merge_group there is no PR range to lint, so the step is
        # skipped and the job goes green — the commits were already linted on the
        # PR before it entered the queue.
        if: ${{ github.event_name == 'pull_request' }}
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}" "tests/**/*.ts"
      - name: Unit tests
        run: pnpm run test:ci
      - name: Build
        run: pnpm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  backend:
    name: Backend (check, test, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ./...
      - name: Test
        run: |
          go test -race -coverprofile=coverage.out -count=1 ./pkg/...
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Go coverage: ${total}%"
          threshold=10
          if [ "$(echo "$total < $threshold" | bc)" -eq 1 ]; then
            echo "::error::Go coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
      - name: Build
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll
      - name: Upload backend binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: backend-dist
          path: dist/gpx_*
          retention-days: 1

  package:
    name: Package and validate
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/
      - name: Download backend binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: backend-dist
          path: dist/

      - name: Sign plugin
        run: npx --yes @grafana/sign-plugin@latest --rootUrls "$GRAFANA_PLUGIN_ROOT_URLS"
        env:
          GRAFANA_PLUGIN_ROOT_URLS: ${{ secrets.GRAFANA_PLUGIN_ROOT_URLS }}
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        continue-on-error: true

      - name: Get plugin metadata
        id: metadata
        run: |
          export GRAFANA_PLUGIN_ID=$(jq -r .id dist/plugin.json)
          export GRAFANA_PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip
          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT

      - name: Package plugin
        run: |
          mv dist ${PLUGIN_ID}
          zip ${ARCHIVE} ${PLUGIN_ID} -r
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}

      - name: Validate plugin
        run: |
          docker run --pull=always \
            -v $PWD/${ARCHIVE}:/archive.zip \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}

      - name: Upload plugin archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.plugin-id }}-${{ steps.metadata.outputs.plugin-version }}
          path: ${{ steps.metadata.outputs.plugin-id }}
          retention-days: 5

  resolve-versions:
    name: Resolve e2e images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@31f6f292a4ccc6530594b8939af571898b09cda8 # ratchet:grafana/plugin-actions/e2e-version@e2e-version/v1.1.1

  playwright-tests:
    needs: [resolve-versions, package]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download plugin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          path: dist
          name: ${{ needs.package.outputs.plugin-id }}-${{ needs.package.outputs.plugin-version }}

      - name: Execute permissions on binary
        run: chmod +x ./dist/gpx_*

      - name: Strip plugin signature for local testing
        run: rm -f ./dist/MANIFEST.txt

      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Grafana
        run: |
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose up --no-deps --build -d grafana

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@31f6f292a4ccc6530594b8939af571898b09cda8 # ratchet:grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.1.1
        with:
          url: http://127.0.0.1:3000/login
          timeout: 120

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        id: run-tests
        run: pnpm run e2e

      - name: Upload e2e test summary
        uses: grafana/plugin-actions/playwright-gh-pages/upload-report-artifacts@31f6f292a4ccc6530594b8939af571898b09cda8 # ratchet:grafana/plugin-actions/playwright-gh-pages/upload-report-artifacts@upload-report-artifacts/v1.1.1
        if: ${{ always() && !cancelled() }}
        with:
          upload-report: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-outcome: ${{ steps.run-tests.outcome }}

      - name: Docker logs
        if: ${{ failure() }}
        run: docker logs nais-apm-app >& grafana-server.log

      - name: Upload server log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.GRAFANA_IMAGE.NAME }}-v${{ matrix.GRAFANA_IMAGE.VERSION }}-${{github.run_id}}-server-log
          path: grafana-server.log
          retention-days: 5

      - name: Stop grafana docker
        run: docker compose down

  publish-report:
    if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish report
        uses: grafana/plugin-actions/playwright-gh-pages/deploy-report-pages@31f6f292a4ccc6530594b8939af571898b09cda8 # ratchet:grafana/plugin-actions/playwright-gh-pages/deploy-report-pages@deploy-report-pages/v1.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Single aggregation gate for the merge queue. This is the ONLY status check
  # the `main` ruleset should require (integration_id 15368 = GitHub Actions);
  # it collapses the real CI signals into one green/red result that reports
  # identically on `pull_request` and `merge_group`.
  #
  # `publish-report` is deliberately NOT a dependency: it is an always()/
  # !cancelled() side-effect that deploys the e2e report and stays green
  # regardless of the test outcome, so it is a poor merge gate.
  ci-ok:
    name: CI OK
    # Run even when a needed job failed or was skipped, but not when the whole
    # run was cancelled — that lets us inspect the aggregated results and turn
    # them into a single pass/fail signal.
    if: ${{ !cancelled() }}
    needs:
      - commitlint
      - frontend
      - backend
      - package
      - resolve-versions
      - playwright-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Aggregate CI results
        env:
          # Per-need results, printed for debuggability.
          RESULT_COMMITLINT: ${{ needs.commitlint.result }}
          RESULT_FRONTEND: ${{ needs.frontend.result }}
          RESULT_BACKEND: ${{ needs.backend.result }}
          RESULT_PACKAGE: ${{ needs.package.result }}
          RESULT_RESOLVE_VERSIONS: ${{ needs.resolve-versions.result }}
          RESULT_PLAYWRIGHT: ${{ needs.playwright-tests.result }}
        run: |
          echo "Needed job results:"
          echo "  commitlint:       ${RESULT_COMMITLINT}"
          echo "  frontend:         ${RESULT_FRONTEND}"
          echo "  backend:          ${RESULT_BACKEND}"
          echo "  package:          ${RESULT_PACKAGE}"
          echo "  resolve-versions: ${RESULT_RESOLVE_VERSIONS}"
          echo "  playwright-tests: ${RESULT_PLAYWRIGHT}"
          # Fail if any needed job failed or was cancelled. `success` and
          # `skipped` both pass, so the nothing-ran / queue case is green.
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (success or skipped)."
