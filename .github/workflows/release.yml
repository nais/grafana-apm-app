# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release (manual)

# MANUAL / HOTFIX ESCAPE HATCH ONLY.
#
# Routine releases are now driven by release-please (.github/workflows/release-please.yml):
# merging its Release PR bumps the version, tags vX.Y.Z, creates the GitHub Release, and
# attaches the signed plugin zip. This workflow used to trigger on `push: tags: v*` — but
# that would DOUBLE-PUBLISH now, because release-please's tag would fire it and create a
# second release for the same tag. So the tag trigger is retired in favour of
# workflow_dispatch: run it by hand only to cut a plugin build off an arbitrary ref when
# the normal release-please path is unavailable (e.g. an emergency hotfix). The
# build-plugin action below creates its own draft GitHub Release from the checked-out
# tag, which is the intended behaviour for a manual cut.
on:
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@31f6f292a4ccc6530594b8939af571898b09cda8 # ratchet:grafana/plugin-actions/build-plugin@build-plugin/v1.1.1
        # To enable plugin signing, add GRAFANA_ACCESS_POLICY_TOKEN to repository secrets.
        # For private signing, also add GRAFANA_PLUGIN_ROOT_URLS (comma-separated Grafana instance URLs).
        # See: https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          sign_root_urls: ${{ secrets.GRAFANA_PLUGIN_ROOT_URLS }}
          go-version: '1.26.4'
          attestation: true

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($0 ~ ver) found=1; next }
            found { print }
          ' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.changelog.outputs.notes }}
