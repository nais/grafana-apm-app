version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # Grafana 13 SDK — defer until we migrate from Grafana 12
      - dependency-name: '@grafana/data'
        versions: ['>=13.0.0']
      - dependency-name: '@grafana/i18n'
        versions: ['>=13.0.0']
      - dependency-name: '@grafana/runtime'
        versions: ['>=13.0.0']
      - dependency-name: '@grafana/schema'
        versions: ['>=13.0.0']
      - dependency-name: '@grafana/ui'
        versions: ['>=13.0.0']
      - dependency-name: '@grafana/scenes'
        versions: ['>=7.0.0']
      # React 19 — Grafana 13 runtime ships React 19
      - dependency-name: 'react'
        versions: ['>=19.0.0']
      - dependency-name: 'react-dom'
        versions: ['>=19.0.0']
      - dependency-name: '@types/react'
        versions: ['>=19.0.0']
      - dependency-name: '@types/react-dom'
        versions: ['>=19.0.0']
      # ESLint 10 ecosystem — eslint-plugin-react has no ESLint 10 support yet
      # (crashes); defer until the plugin ecosystem catches up.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      - dependency-name: '@grafana/eslint-config'
        versions: ['>=10.0.0']
      # react-hooks 7.1 adds set-state-in-effect, which flags existing effects —
      # a refactor, not a dep bump; defer.
      - dependency-name: 'eslint-plugin-react-hooks'
        versions: ['>=7.1.0']
      # React Router 7 — breaks Grafana's react-router-dom-v5-compat shim
      # (the repo pins react-router 6.30.4 via overrides); defer to a Grafana
      # version whose compat shim supports v7.
      - dependency-name: 'react-router'
        versions: ['>=7.0.0']
      - dependency-name: 'react-router-dom'
        versions: ['>=7.0.0']
    groups:
      npm-all:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-all:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      go-all:
        patterns:
          - '*'
